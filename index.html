<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4K Starfield — 80s Bloom</title>
<style>
  :root {
    --panel-h: 112px;
    --png-scale: 1;
    --png-x: 0%;
    --png-y: 0%;
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }

  /* ═══════════ Viewport ═══════════ */
  #viewport {
    width: 100%;
    height: calc(100vh - var(--panel-h));
    height: calc(100dvh - var(--panel-h));
    display: flex;
    justify-content: center;
    align-items: center;
    background: #000;
  }

  /* 16:9 Scene — dimensions set by JS */
  #scene {
    position: relative;
    overflow: hidden;
    background: #000;
    line-height: 0;               /* kill inline-img gap */
  }

  #starfield {                    /* 4K internal, CSS-scaled */
    display: block;
    width: 100%; height: 100%;
  }

  /* ═══════════ Dual-Layer Overlay ═══════════ */
  .overlay-img {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: block;
    pointer-events: none;
    transform: translate(var(--png-x), var(--png-y)) scale(var(--png-scale));
    transform-origin: center center;
    will-change: filter, opacity, transform;
  }
  #baseLayer { z-index: 2; }
  #glowLayer {
    z-index: 3;
    mix-blend-mode: screen;       /* ← the 80s bloom compositing */
  }

  /* ═══════════ Control Panel ═══════════ */
  #panel {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    min-height: 104px;
    max-height: min(42vh, 260px);
    max-height: min(42dvh, 260px);
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    background: rgba(6, 6, 16, 0.94);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255, 255, 255, 0.04);
    overflow-x: hidden;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    z-index: 1000;
  }

  #tabs {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .tab-btn {
    appearance: none;
    -webkit-appearance: none;
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 999px;
    padding: 7px 13px;
    background: rgba(255, 255, 255, 0.045);
    color: rgba(255, 255, 255, 0.42);
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 1.7px;
    text-transform: uppercase;
    cursor: pointer;
  }

  .tab-btn.active {
    background: rgba(118, 96, 255, 0.22);
    border-color: rgba(150, 132, 255, 0.38);
    color: rgba(255, 255, 255, 0.78);
    box-shadow: 0 0 18px rgba(110, 90, 255, 0.12);
  }

  .tab-panel {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 16px 24px;
    flex-wrap: wrap;
  }

  .tab-panel.active {
    display: flex;
  }

  .ctl {
    flex: 0 1 132px;
    min-width: 120px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .ctl label {
    font-size: 8.5px;
    font-weight: 700;
    letter-spacing: 1.8px;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.30);
    white-space: nowrap;
  }
  .ctl .v {
    font-family: "SF Mono", "Cascadia Code", "Fira Code", Consolas, monospace;
    font-size: 9px;
    color: rgba(255, 255, 255, 0.22);
  }

  /* ═══════════ Range Inputs ═══════════ */
  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 124px; max-width: 100%; height: 3px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.07);
    outline: none;
    cursor: pointer;
    touch-action: pan-y;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 32%, #a798ff, #5e4dcf);
    box-shadow: 0 0 10px rgba(110, 90, 255, 0.45),
                0 0 3px  rgba(110, 90, 255, 0.3);
    cursor: pointer;
    transition: box-shadow 0.2s;
  }
  input[type="range"]::-webkit-slider-thumb:hover {
    box-shadow: 0 0 18px rgba(110, 90, 255, 0.8),
                0 0 5px  rgba(110, 90, 255, 0.5);
  }
  input[type="range"]::-moz-range-thumb {
    width: 14px; height: 14px; border: none;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 32%, #a798ff, #5e4dcf);
    box-shadow: 0 0 10px rgba(110, 90, 255, 0.45);
    cursor: pointer;
  }
  input[type="range"]::-moz-range-track {
    height: 3px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.07);
    border: none;
  }

  @media (max-width: 820px) {
    #panel {
      max-height: min(46vh, 310px);
      max-height: min(46dvh, 310px);
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    }

    #tabs {
      justify-content: flex-start;
      flex-wrap: nowrap;
      overflow-x: auto;
      padding-bottom: 2px;
      -webkit-overflow-scrolling: touch;
    }

    .tab-btn {
      flex: 0 0 auto;
      padding: 8px 13px;
    }

    .tab-panel.active {
      justify-content: flex-start;
      align-content: flex-start;
      gap: 14px;
    }

    .ctl {
      flex: 1 1 calc(50% - 14px);
      min-width: 138px;
      align-items: stretch;
    }

    .ctl label,
    .ctl .v {
      text-align: center;
    }

    input[type="range"] {
      width: 100%;
      height: 4px;
    }

    input[type="range"]::-webkit-slider-thumb {
      width: 18px;
      height: 18px;
    }

    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
    }
  }

  @media (max-width: 380px) {
    .ctl {
      flex-basis: 100%;
    }
  }
</style>
</head>
<body>

<!-- ══════════════════ SCENE ══════════════════ -->
<div id="viewport">
  <div id="scene">
    <!-- 4K Canvas: internal 3840×2160, visually scaled by CSS -->
    <canvas id="starfield" width="3840" height="2160"></canvas>

    <!-- Layer 1 — Base (crisp image, optional micro-blur edge soften) -->
    <img id="baseLayer" class="overlay-img"
         src="https://raw.githubusercontent.com/JRDN-R/Church-Graphic/main/darkskysteeple.png"
         alt="" draggable="false">

    <!-- Layer 2 — Glow (heavy blur + screen blend = 80s halation) -->
    <img id="glowLayer" class="overlay-img"
         src="https://raw.githubusercontent.com/JRDN-R/Church-Graphic/main/darkskysteeple.png"
         alt="" draggable="false">
  </div>
</div>

<!-- ══════════════════ CONTROLS ══════════════════ -->
<div id="panel">
  <div id="tabs" role="tablist" aria-label="Scene controls">
    <button class="tab-btn active" type="button" data-tab="stars">Stars</button>
    <button class="tab-btn" type="button" data-tab="png">PNG</button>
    <button class="tab-btn" type="button" data-tab="look">Look</button>
  </div>

  <div class="tab-panel active" id="tab-stars">
    <div class="ctl">
      <label>Star Amount</label>
      <input type="range" id="rCount" min="100" max="15000" value="2500" step="50">
      <span class="v" id="vCount">2,500</span>
    </div>
    <div class="ctl">
      <label>Star Size</label>
      <input type="range" id="rStarSize" min="0.25" max="5" value="1" step="0.05">
      <span class="v" id="vStarSize">1.00×</span>
    </div>
    <div class="ctl">
      <label>Twinkle Speed</label>
      <input type="range" id="rSpeed" min="0.1" max="5" value="1" step="0.1">
      <span class="v" id="vSpeed">1.0×</span>
    </div>
  </div>

  <div class="tab-panel" id="tab-png">
    <div class="ctl">
      <label>PNG Size</label>
      <input type="range" id="rPngSize" min="0.2" max="2.5" value="1" step="0.01">
      <span class="v" id="vPngSize">100%</span>
    </div>
    <div class="ctl">
      <label>PNG Left / Right</label>
      <input type="range" id="rPngX" min="-100" max="100" value="0" step="1">
      <span class="v" id="vPngX">0%</span>
    </div>
    <div class="ctl">
      <label>PNG Up / Down</label>
      <input type="range" id="rPngY" min="-100" max="100" value="0" step="1">
      <span class="v" id="vPngY">0%</span>
    </div>
  </div>

  <div class="tab-panel" id="tab-look">
    <div class="ctl">
      <label>Gradient Brightness</label>
      <input type="range" id="rGradient" min="0" max="3" value="1" step="0.01">
      <span class="v" id="vGradient">1.00×</span>
    </div>
    <div class="ctl">
      <label>Base Edge Soften</label>
      <input type="range" id="rEdge" min="0" max="2" value="0.4" step="0.05">
      <span class="v" id="vEdge">0.40 px</span>
    </div>
    <div class="ctl">
      <label>80s Bloom Spread</label>
      <input type="range" id="rBloom" min="0" max="80" value="28" step="1">
      <span class="v" id="vBloom">28 px</span>
    </div>
    <div class="ctl">
      <label>80s Bloom Opacity</label>
      <input type="range" id="rOpac" min="0" max="1" value="0.55" step="0.01">
      <span class="v" id="vOpac">0.55</span>
    </div>
  </div>
</div>

<!-- ══════════════════ ENGINE ══════════════════ -->
<script>
(() => {
  /* ────────────────────────────────────
     Constants
     ──────────────────────────────────── */
  const W = 3840, H = 2160, AR = W / H;

  /* ────────────────────────────────────
     DOM Refs
     ──────────────────────────────────── */
  const $ = id => document.getElementById(id);
  const root     = document.documentElement,
        viewport = $('viewport'),
        scene    = $('scene'),
        panel    = $('panel'),
        cvs      = $('starfield'),
        ctx      = cvs.getContext('2d'),
        baseImg  = $('baseLayer'),
        glowImg  = $('glowLayer');

  /* ════════════════════════════════════════════
           S T A R   F I E L D
     ════════════════════════════════════════════ */
  let stars      = [];
  let tSpeed     = 1;                       // twinkle speed multiplier
  let starSize   = 1;                       // star size multiplier
  let sky        = null;

  /** Build one star with randomised properties */
  function createStar() {
    return {
      x:     Math.random() * W,
      y:     Math.random() * H,
      r:     0.3  + Math.random() * 1.8,    // radius  0.3 – 2.1 px @4K
      base:  0.18 + Math.random() * 0.62,   // resting alpha
      phase: Math.random() * 6.2832,        // 0 – 2π  random start
      freq:  0.20 + Math.random() * 1.3,    // personal speed factor
      /* White-to-slightly-blue palette */
      cr: 212 + (Math.random() * 43) | 0,
      cg: 220 + (Math.random() * 35) | 0,
      cb: 240 + (Math.random() * 15) | 0
    };
  }

  /** Grow or shrink the pool to exactly n stars */
  function syncCount(n) {
    while (stars.length < n) stars.push(createStar());
    if    (stars.length > n) stars.length = n;
  }

  function clampByte(v) {
    return Math.max(0, Math.min(255, Math.round(v)));
  }

  function rgb(r, g, b) {
    return `rgb(${clampByte(r)}, ${clampByte(g)}, ${clampByte(b)})`;
  }

  /* ── Rebuild sky gradient when brightness changes ── */
  function setGradientBrightness(mult) {
    sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0.00, '#000000');
    sky.addColorStop(0.50, rgb(1 * mult, 1 * mult, 8 * mult));
    sky.addColorStop(0.78, rgb(4 * mult, 4 * mult, 13 * mult));
    sky.addColorStop(1.00, rgb(10 * mult, 10 * mult, 26 * mult));
  }

  /* ── Render one frame ── */
  function frame(t) {
    /* Sky */
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    /* Stars — dual-wave organic twinkle */
    const T = t * 0.001 * tSpeed;
    for (let i = 0, n = stars.length; i < n; i++) {
      const s  = stars[i];
      const w1 = Math.sin(T * s.freq + s.phase)                * 0.30;
      const w2 = Math.sin(T * s.freq * 0.37 + s.phase * 1.73)  * 0.12;
      let   a  = s.base + w1 + w2;
      a = a < 0.02 ? 0.02 : a > 1 ? 1 : a;

      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r * starSize, 0, 6.2832);
      ctx.fillStyle = `rgba(${s.cr},${s.cg},${s.cb},${a})`;
      ctx.fill();
    }
    requestAnimationFrame(frame);
  }

  /* ════════════════════════════════════════════
         R E S P O N S I V E   1 6 : 9
     ════════════════════════════════════════════ */
  function updatePanelHeight() {
    const h = Math.ceil(panel.getBoundingClientRect().height);
    root.style.setProperty('--panel-h', h + 'px');
    resize();
  }

  function resize() {
    const vw = viewport.clientWidth, vh = viewport.clientHeight;
    let w = vw, h = w / AR;
    if (h > vh) { h = vh; w = h * AR; }
    scene.style.width  = w + 'px';
    scene.style.height = h + 'px';
  }

  addEventListener('resize', updatePanelHeight);
  if ('ResizeObserver' in window) {
    new ResizeObserver(updatePanelHeight).observe(panel);
  }

  /* ════════════════════════════════════════════
         I M A G E   C O M P O S I T I N G
     ════════════════════════════════════════════ */
  const setPngSize = scale => {
    root.style.setProperty('--png-scale', scale);
  };
  const setPngX = value => {
    root.style.setProperty('--png-x', value + '%');
  };
  const setPngY = value => {
    root.style.setProperty('--png-y', value + '%');
  };
  const setEdge = px => {
    baseImg.style.filter = px > 0 ? `blur(${px}px)` : 'none';
  };
  const setBloom = (spread, opacity) => {
    glowImg.style.filter  = `blur(${spread}px)`;
    glowImg.style.opacity = opacity;
  };

  /* ════════════════════════════════════════════
         T A B S
     ════════════════════════════════════════════ */
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tab = btn.dataset.tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === `tab-${tab}`));
      requestAnimationFrame(updatePanelHeight);
    });
  });

  /* ════════════════════════════════════════════
         C O N T R O L   W I R I N G
     ════════════════════════════════════════════ */
  function wire(sliderId, readoutId, fmt, fn) {
    const sl = $(sliderId), rd = $(readoutId);
    sl.addEventListener('input', () => {
      const v = parseFloat(sl.value);
      rd.textContent = fmt(v);
      fn(v);
    });
  }

  wire('rCount', 'vCount',
       v => v.toLocaleString(),
       v => syncCount(v | 0));

  wire('rStarSize', 'vStarSize',
       v => v.toFixed(2) + '×',
       v => { starSize = v; });

  wire('rSpeed', 'vSpeed',
       v => v.toFixed(1) + '×',
       v => { tSpeed = v; });

  wire('rPngSize', 'vPngSize',
       v => Math.round(v * 100) + '%',
       v => setPngSize(v));

  wire('rPngX', 'vPngX',
       v => v + '%',
       v => setPngX(v));

  wire('rPngY', 'vPngY',
       v => v + '%',
       v => setPngY(v));

  wire('rGradient', 'vGradient',
       v => v.toFixed(2) + '×',
       v => setGradientBrightness(v));

  wire('rEdge', 'vEdge',
       v => v.toFixed(2) + ' px',
       v => setEdge(v));

  wire('rBloom', 'vBloom',
       v => v + ' px',
       v => setBloom(v, parseFloat($('rOpac').value)));

  wire('rOpac', 'vOpac',
       v => v.toFixed(2),
       v => setBloom(parseFloat($('rBloom').value), v));

  /* ════════════════════════════════════════════
         I N I T I A L I S E
     ════════════════════════════════════════════ */
  syncCount(parseInt($('rCount').value));
  starSize = parseFloat($('rStarSize').value);
  setPngSize(parseFloat($('rPngSize').value));
  setPngX(parseFloat($('rPngX').value));
  setPngY(parseFloat($('rPngY').value));
  setGradientBrightness(parseFloat($('rGradient').value));
  setEdge(parseFloat($('rEdge').value));
  setBloom(parseFloat($('rBloom').value), parseFloat($('rOpac').value));
  updatePanelHeight();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
